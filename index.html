<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disney Novelas Inolvidables 🏰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
    <style>
        :root {
            --gold: #C9933A;
            --gold-light: #F0C97A;
            --dark: #0f0c1a;
            --card: #1a1628;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--dark);
            color: #f0ece8;
            font-family: 'Cinzel', 'serif';
            font-weight: 300;
            overflow-x: hidden;
        }

        /* Estrellas fondo */
        #stars-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star-bg {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--d) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.1;
            }

            to {
                opacity: 0.7;
            }
        }

        .main-wrap {
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header-section {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
        }

        .castle {
            font-size: 3rem;
            display: block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(201, 147, 58, 0.6));
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.2rem, 5vw, 2.4rem);
            color: var(--gold-light);
            margin: 0.5rem 0 0.25rem;
        }

        .subtitle {
            color: #9b95a3;
            font-size: 0.85rem;
        }

        /* Botón música */
        #music-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
            background: rgba(26, 22, 40, 0.85);
            border: 1px solid rgba(201, 147, 58, 0.3);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, transform 0.2s;
            backdrop-filter: blur(6px);
        }

        #music-btn:hover {
            border-color: var(--gold);
            transform: scale(1.1);
        }

        #music-btn.playing {
            border-color: var(--gold);
            animation: pulse-btn 1.5s ease-in-out infinite;
        }

        @keyframes pulse-btn {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(201, 147, 58, 0.4);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(201, 147, 58, 0);
            }
        }

        /* Stats */
        .stat-card {
            background: var(--card);
            border: 1px solid rgba(201, 147, 58, 0.2);
            border-radius: 12px;
            padding: 14px 22px;
            text-align: center;
        }

        .stat-num {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--gold-light);
        }

        .stat-num.bump {
            animation: bump 0.3s ease;
        }

        @keyframes bump {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        .stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9b95a3;
        }

        /* Progress */
        .progress {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 99px;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        /* Controles */
        input.form-control {
            background: var(--card);
            border-color: rgba(201, 147, 58, 0.3);
            color: #f0ece8;
            border-radius: 99px;
        }

        input.form-control::placeholder {
            color: #9b95a3;
        }

        input.form-control:focus {
            background: var(--card);
            border-color: var(--gold);
            color: #f0ece8;
            box-shadow: none;
        }

        .btn-outline-secondary {
            border-color: rgba(201, 147, 58, 0.3);
            color: #9b95a3;
            border-radius: 99px;
        }

        .btn-outline-secondary:hover {
            background: rgba(201, 147, 58, 0.1);
            border-color: var(--gold);
            color: var(--gold-light);
        }

        .filter-btn.active {
            background: var(--gold) !important;
            border-color: var(--gold) !important;
            color: #0f0c1a !important;
            font-weight: 500;
        }

        /* Cards — altura fija para uniformidad */
        .book-col {
            display: flex;
        }

        .book-card {
            cursor: pointer;
            background: var(--card);
            border: 1px solid rgba(201, 147, 58, 0.15);
            border-radius: 12px;
            padding: 14px 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: border-color 0.2s, background 0.3s, transform 0.15s;
            width: 100%;
            min-height: 72px;
        }

        .book-card:hover {
            border-color: rgba(201, 147, 58, 0.5);
            transform: translateY(-2px);
        }

        .book-card.comprado {
            background: rgba(58, 158, 110, 0.1);
            border-color: rgba(78, 201, 138, 0.45);
        }

        .book-card.comprado .book-title {
            color: #4ec98a;
        }

        /* Shimmer */
        .book-card {
            overflow: hidden;
            position: relative;
        }

        .book-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
            transform: translateX(-100%);
            pointer-events: none;
        }

        .book-card.shimmer::after {
            animation: shimmer 0.5s ease forwards;
        }

        @keyframes shimmer {
            to {
                transform: translateX(100%);
            }
        }

        .book-num {
            color: #9b95a3;
            font-size: 0.7rem;
            min-width: 18px;
            padding-top: 2px;
            flex-shrink: 0;
        }

        .book-title { font-size: 0.78rem; line-height: 1.4; flex: 1; transition: color 0.3s; }
        @media (max-width: 576px) { .book-title { font-size: 0.68rem; } .book-num { font-size: 0.62rem; } }

                .check-circle {
                    width: 20px;
                    height: 20px;
                    border-radius: 50%;
                    border: 1.5px solid rgba(255, 255, 255, 0.15);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-shrink: 0;
                    margin-top: 1px;
                    transition: background 0.3s, border-color 0.3s, transform 0.2s;
                }

        .book-card.comprado .check-circle {
            background: #3a9e6e;
            border-color: #3a9e6e;
            transform: scale(1.1);
        }

        .check-circle svg {
            display: none;
        }

        .book-card.comprado .check-circle svg {
            display: block;
        }

        /* Confetti canvas fullscreen */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            width: 100%;
            height: 100%;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
        }

        .toast {
            background: var(--card);
            border: 1px solid rgba(201, 147, 58, 0.3);
            color: #f0ece8;
        }

        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            gap: 1rem;
        }

        .spinner-border {
            color: var(--gold) !important;
        }

        #loading p {
            color: #9b95a3;
            font-size: 0.85rem;
            font-style: italic;
        }

        .empty {
            color: #9b95a3;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>

<body>

    <div id="stars-bg"></div>
    <canvas id="confetti-canvas"></canvas>
    <button id="music-btn" title="Música" onclick="toggleMusic()">🎵</button>

    <!-- Audio — poné tu MP3 en la misma carpeta y cambiá el src -->
    <audio id="bg-music" preload="auto"></audio>

    <div class="main-wrap">
        <div class="container py-4" style="max-width:880px;">

            <div class="header-section">
                <span class="castle">🏰</span>
                <h1>Disney Novelas Inolvidables</h1>
                <p class="subtitle">Colección completa · 72 títulos</p>
            </div>

            <div class="row g-3 justify-content-center mb-3">
                <div class="col-auto">
                    <div class="stat-card">
                        <div class="stat-num" id="stat-comprados">0</div>
                        <div class="stat-label">comprados</div>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="stat-card">
                        <div class="stat-num" id="stat-faltan">72</div>
                        <div class="stat-label">faltan</div>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="stat-card">
                        <div class="stat-num" id="stat-pct">0%</div>
                        <div class="stat-label">completa</div>
                    </div>
                </div>
            </div>

            <div class="progress mb-4" style="height:6px;">
                <div class="progress-bar" id="progress-fill" style="width:0%;"></div>
            </div>

            <div class="d-flex gap-2 flex-wrap mb-4">
                <input type="text" id="search" class="form-control" placeholder="🔍  Buscar película..."
                    oninput="render()" style="max-width:260px;" />
                <button class="btn btn-outline-secondary btn-sm filter-btn active"
                    onclick="setFilter('todos',this)">Todos</button>
                <button class="btn btn-outline-secondary btn-sm filter-btn" onclick="setFilter('comprados',this)">✓
                    Comprados</button>
                <button class="btn btn-outline-secondary btn-sm filter-btn"
                    onclick="setFilter('faltan',this)">Faltan</button>
            </div>

            <div class="row g-2" id="grid"></div>
        </div>
    </div>

    <div class="toast-container">
        <div id="toast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toast-msg">Guardado ✓</div>
            </div>
        </div>
    </div>

    <div id="loading">
        <div class="spinner-border" role="status"></div>
        <p>Cargando la colección...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONFIGURACIÓN
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const SUPABASE_URL = 'https://bakrvqetpzqtvthqrjcb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJha3J2cWV0cHpxdHZ0aHFyamNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDQyNDAsImV4cCI6MjA5NDcyMDI0MH0.EUu0KKVhto9VvPvL2BFn2q9AWlKrfgtWn5S6Vc2QQBQ';
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const LIBROS = [
            "La bella y la bestia", "Frozen. El reino del hielo", "Blanca Nieves", "El rey León",
            "Coco", "La Sirenita", "Intensamente", "La Cenicienta", "101 Dálmatas", "Mulán",
            "Moana", "Valiente", "Encanto", "Dumbo", "Elementos", "Enredados",
            "Alicia en el país de las maravillas", "El libro de la selva", "Pinocho", "Red",
            "Pocahontas", "Luca", "Raya y el último dragón", "Bolt", "Aladdín", "Toy Story",
            "Soul", "Up", "Lilo y Stitch", "Bambi", "La princesa y el sapo", "Los Increíbles",
            "Ratatouille", "La bella durmiente", "Monsters, Inc.", "Wall-E", "Cars",
            "El jorobado de Notre Dame", "Un gran dinosaurio", "Zootopia", "6 grandes héroes",
            "Wish", "Buscando a Nemo", "La dama y el vagabundo", "Lightyear", "Onward",
            "Ralph el demoledor", "Buscando a Dory", "Mundo extraño", "El zorro y el sabueso",
            "Robin Hood", "Hermano oso", "Hércules", "Peter Pan", "Frozen 2",
            "El emperador y sus locuras", "Toy Story 2", "Merlín el encantador",
            "Los Aristogatos", "Moana 2", "El planeta del tesoro", "Bichos. Una aventura en mininiatura",
            "Los Increíbles 2", "Atlantis", "Elio", "Oliver y su pandilla", "Ralph rompe internet",
            "Cars 2", "Los rescatadores", "Monstruos University", "Aviones",
            "Los rescatadores en cangurolandia"
        ];

        const API_HEADERS = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
        };

        let comprados = new Set();
        let filtro = 'todos';
        let saveTimer = null;
        let toastEl = null;

        // ── Estrellas ──
        (function createStars() {
            const bg = document.getElementById('stars-bg');
            for (let i = 0; i < 80; i++) {
                const s = document.createElement('div');
                s.className = 'star-bg';
                const size = Math.random() * 2 + 1;
                s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random() * 100}%;left:${Math.random() * 100}%;--d:${2 + Math.random() * 4}s;animation-delay:${Math.random() * 4}s;`;
                bg.appendChild(s);
            }
        })();

        // ── Música ──
        const audio = document.getElementById('bg-music');
        audio.volume = 0.35;
        let musicStarted = false;

        intro = 'mp3/intro.mp3';
        enredados = 'mp3/enredados.mp3';

        const PLAYLIST = [intro, enredados];
        let currentTrack = 0;

        function loadTrack(index) {
            audio.src = PLAYLIST[index];
            audio.load();
        }

        audio.addEventListener('ended', () => {
            currentTrack = (currentTrack + 1) % PLAYLIST.length;
            loadTrack(currentTrack);
            audio.play();
        });

        loadTrack(0);

        function tryAutoplay() {
            audio.play().then(() => {
                musicStarted = true;
                document.getElementById('music-btn').textContent = '🔊';
                document.getElementById('music-btn').classList.add('playing');
            }).catch(() => {
                // autoplay bloqueado, esperamos click del usuario
            });
        }

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                document.getElementById('music-btn').textContent = '🔊';
                document.getElementById('music-btn').classList.add('playing');
            } else {
                audio.pause();
                document.getElementById('music-btn').textContent = '🎵';
                document.getElementById('music-btn').classList.remove('playing');
            }
        }

        // Intentar autoplay cuando el usuario interactúa por primera vez
        document.addEventListener('click', function startOnce() {
            if (!musicStarted) tryAutoplay();
            document.removeEventListener('click', startOnce);
        }, { once: true });

        // ── Confetti fullscreen ──
        const canvas = document.getElementById('confetti-canvas');
        const ctx2 = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiFrame = null;

        const CONFETTI_COLORS = ['#F0C97A', '#C9933A', '#4ec98a', '#a78bfa', '#f472b6', '#60a5fa', '#fff'];
        const CONFETTI_EMOJIS = ['✨', '⭐', '🌟', '💫', '🏰', '🪄', '💛'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function launchConfetti() {
            resizeCanvas();
            // Lanzar desde la parte inferior, como Twitter/birthday
            for (let i = 0; i < 120; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + 20,
                    vx: (Math.random() - 0.5) * 6,
                    vy: -(Math.random() * 12 + 8),
                    gravity: 0.25,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.2,
                    size: Math.random() * 12 + 8,
                    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
                    emoji: Math.random() > 0.5 ? CONFETTI_EMOJIS[Math.floor(Math.random() * CONFETTI_EMOJIS.length)] : null,
                    alpha: 1,
                    shape: Math.random() > 0.5 ? 'rect' : 'circle',
                    delay: Math.random() * 30,
                });
            }
            if (!confettiFrame) animateConfetti();
        }

        function animateConfetti() {
            ctx2.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles = confettiParticles.filter(p => p.alpha > 0.01);

            confettiParticles.forEach(p => {
                if (p.delay > 0) { p.delay--; return; }
                p.x += p.vx;
                p.vy += p.gravity;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                if (p.y > canvas.height * 0.3) p.alpha -= 0.012;

                ctx2.save();
                ctx2.globalAlpha = Math.max(0, p.alpha);
                ctx2.translate(p.x, p.y);
                ctx2.rotate(p.rotation);

                if (p.emoji) {
                    ctx2.font = `${p.size * 1.5}px serif`;
                    ctx2.textAlign = 'center';
                    ctx2.textBaseline = 'middle';
                    ctx2.fillText(p.emoji, 0, 0);
                } else if (p.shape === 'rect') {
                    ctx2.fillStyle = p.color;
                    ctx2.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                } else {
                    ctx2.fillStyle = p.color;
                    ctx2.beginPath();
                    ctx2.arc(0, 0, p.size / 3, 0, Math.PI * 2);
                    ctx2.fill();
                }
                ctx2.restore();
            });

            if (confettiParticles.length > 0) {
                confettiFrame = requestAnimationFrame(animateConfetti);
            } else {
                confettiFrame = null;
                ctx2.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // ── Supabase ──
        async function loadState() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/coleccion?id=eq.1&select=comprados`, { headers: API_HEADERS });
                const data = await res.json();
                if (data?.[0]?.comprados) comprados = new Set(data[0].comprados);
            } catch (e) {
                showToast('⚠️ No se pudo conectar');
            } finally {
                document.getElementById('loading').remove();
            }
            render();
        }

        async function saveState() {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/coleccion?id=eq.1`, {
                    method: 'PATCH',
                    headers: API_HEADERS,
                    body: JSON.stringify({ comprados: [...comprados] })
                });
                showToast('Guardado ✓');
            } catch (e) {
                showToast('⚠️ Error al guardar');
            }
        }

        function debouncedSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveState, 600);
        }

        // ── UI ──
        function setFilter(f, btn) {
            filtro = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function updateStats() {
            const c = comprados.size;
            const pct = Math.round(c / LIBROS.length * 100);
            ['stat-comprados', 'stat-faltan', 'stat-pct'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('bump');
                void el.offsetWidth;
                el.classList.add('bump');
            });
            document.getElementById('stat-comprados').textContent = c;
            document.getElementById('stat-faltan').textContent = LIBROS.length - c;
            document.getElementById('stat-pct').textContent = pct + '%';
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        function render() {
            const q = document.getElementById('search').value.toLowerCase();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let visible = 0;

            LIBROS.forEach((titulo, i) => {
                const esCom = comprados.has(i);
                if (filtro === 'comprados' && !esCom) return;
                if (filtro === 'faltan' && esCom) return;
                if (q && !titulo.toLowerCase().includes(q)) return;
                visible++;

                const col = document.createElement('div');
                col.className = 'col-6 col-sm-4 col-md-3 book-col';
                col.innerHTML = `
      <div class="book-card${esCom ? ' comprado' : ''}">
        <span class="book-num pt-1">${i + 1}</span>
        <span class="book-title flex-grow-1">${titulo}</span>
        <div class="check-circle flex-shrink-0">
          ${esCom ? `<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}
        </div>
      </div>`;

                col.querySelector('.book-card').onclick = () => {
                    const adding = !comprados.has(i);
                    if (adding) {
                        comprados.add(i);
                        launchConfetti();
                    } else {
                        comprados.delete(i);
                    }
                    const card = col.querySelector('.book-card');
                    card.classList.add('shimmer');
                    setTimeout(() => card.classList.remove('shimmer'), 500);
                    updateStats();
                    render();
                    debouncedSave();
                };
                grid.appendChild(col);
            });

            if (visible === 0) {
                grid.innerHTML = '<div class="col"><p class="empty">No hay resultados</p></div>';
            }
            updateStats();
        }

        function showToast(msg) {
            if (!toastEl) toastEl = new bootstrap.Toast(document.getElementById('toast'), { delay: 2000 });
            document.getElementById('toast-msg').textContent = msg;
            toastEl.show();
        }

        loadState();
    </script>
</body>

</html>
