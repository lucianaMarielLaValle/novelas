<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disney Novelas Inolvidables 🏰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
    <style>
        body {
            background-color: #0f0c1a;
            color: #f0ece8;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #F0C97A;
        }

        .book-card {
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
            background-color: #1a1628;
            border: 1px solid rgba(201, 147, 58, 0.2);
        }

        .book-card:hover {
            border-color: rgba(201, 147, 58, 0.6);
        }

        .book-card.comprado {
            background-color: rgba(58, 158, 110, 0.12);
            border-color: rgba(78, 201, 138, 0.5);
        }

        .book-card.comprado .book-title {
            color: #4ec98a;
        }

        .check-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .book-card.comprado .check-circle {
            background: #3a9e6e;
            border-color: #3a9e6e;
        }

        .progress {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .progress-bar {
            background: linear-gradient(90deg, #C9933A, #F0C97A);
        }

        .filter-btn.active {
            background-color: #C9933A !important;
            border-color: #C9933A !important;
            color: #0f0c1a !important;
        }

        input.form-control {
            background-color: #1a1628;
            border-color: rgba(201, 147, 58, 0.3);
            color: #f0ece8;
        }

        input.form-control::placeholder {
            color: #9b95a3;
        }

        input.form-control:focus {
            background-color: #1a1628;
            border-color: #C9933A;
            color: #f0ece8;
            box-shadow: none;
        }

        .stat-card {
            background-color: #1a1628;
            border: 1px solid rgba(201, 147, 58, 0.2);
            border-radius: 12px;
        }

        .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #F0C97A;
        }

        .stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9b95a3;
        }

        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
        }

        .toast {
            background-color: #1a1628;
            border: 1px solid rgba(201, 147, 58, 0.3);
            color: #f0ece8;
        }

        .book-num {
            color: #9b95a3;
            font-size: 0.72rem;
            min-width: 20px;
        }

        .btn-outline-secondary {
            border-color: rgba(201, 147, 58, 0.3);
            color: #9b95a3;
        }

        .btn-outline-secondary:hover {
            background-color: rgba(201, 147, 58, 0.1);
            border-color: #C9933A;
            color: #F0C97A;
        }
    </style>
</head>

<body>

    <div class="container py-4" style="max-width: 860px;">

        <!-- Header -->
        <div class="text-center mb-4">
            <div style="font-size:2.5rem">🏰</div>
            <h1 class="fs-2 mb-1">Disney Novelas Inolvidables</h1>
            <p class="text-secondary small">Colección completa · 72 títulos</p>
        </div>

        <!-- Stats -->
        <div class="row g-3 justify-content-center mb-3">
            <div class="col-auto">
                <div class="stat-card px-4 py-3 text-center">
                    <div class="stat-num" id="stat-comprados">0</div>
                    <div class="stat-label">comprados</div>
                </div>
            </div>
            <div class="col-auto">
                <div class="stat-card px-4 py-3 text-center">
                    <div class="stat-num" id="stat-faltan">72</div>
                    <div class="stat-label">faltan</div>
                </div>
            </div>
            <div class="col-auto">
                <div class="stat-card px-4 py-3 text-center">
                    <div class="stat-num" id="stat-pct">0%</div>
                    <div class="stat-label">completa</div>
                </div>
            </div>
        </div>

        <!-- Progress bar -->
        <div class="progress mb-4" style="height:6px; border-radius:99px;">
            <div class="progress-bar" id="progress-fill" style="width:0%; border-radius:99px;"></div>
        </div>

        <!-- Controles -->
        <div class="d-flex gap-2 flex-wrap mb-4">
            <input type="text" id="search" class="form-control" placeholder="Buscar película..." oninput="render()"
                style="max-width:260px;" />
            <button class="btn btn-outline-secondary btn-sm filter-btn active"
                onclick="setFilter('todos',this)">Todos</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" onclick="setFilter('comprados',this)">✓
                Comprados</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn"
                onclick="setFilter('faltan',this)">Faltan</button>
        </div>

        <!-- Grid de libros -->
        <div class="row g-2" id="grid"></div>

    </div>

    <!-- Toast de estado -->
    <div class="toast-container">
        <div id="toast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toast-msg">Guardado ✓</div>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
        style="background:#0f0c1a; z-index:999;">
        <div class="spinner-border" style="color:#C9933A;" role="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONFIGURACIÓN — reemplazá estos dos valores
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const SUPABASE_URL = 'https://bakrvqetpzqtvthqrjcb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mjMatYgXfotMj1LbIrq2gA_LfWfrlHP';
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const LIBROS = [
            "La bella y la bestia", "Frozen. El reino del hielo", "Blanca Nieves", "El rey León",
            "Coco", "La Sirenita", "Intensa mente", "La Cenicienta", "101 Dálmatas", "Mulán",
            "Moana", "Valiente", "Encanto", "Dumbo", "Elementos", "Enredados",
            "Alicia en el país de las maravillas", "El libro de la selva", "Pinocho", "Red",
            "Pocahontas", "Luca", "Raya y el último dragón", "Bolt", "Aladdín", "Toy Story",
            "Soul", "Up", "Lilo y Stitch", "Bambi", "La princesa y el sapo", "Los Increíbles",
            "Ratatouille", "La bella durmiente", "Monsters, Inc.", "Wall-E", "Cars",
            "El jorobado de Notre Dame", "Un gran dinosaurio", "Zootopia", "6 grandes héroes",
            "Wish", "Buscando a Nemo", "La dama y el vagabundo", "Lightyear", "Onward",
            "Ralph el demoledor", "Buscando a Dory", "Mundo extraño", "El zorro y el sabueso",
            "Robin Hood", "Hermano oso", "Hércules", "Peter Pan", "Frozen 2",
            "El emperador y sus locuras", "Toy Story 2", "Merlín el encantador",
            "Los Aristogatos", "Moana 2", "El planeta del tesoro", "Bichos. Una aventura en mininiatura",
            "Los Increíbles 2", "Atlantis", "Elio", "Oliver y su pandilla", "Ralph rompe internet",
            "Cars 2", "Los rescatadores", "Monstruos University", "Aviones",
            "Los rescatadores en cangurolandia"
        ];

        const API_HEADERS = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
        };

        let comprados = new Set();
        let filtro = 'todos';
        let saveTimer = null;
        let toastEl = null;

        async function loadState() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/coleccion?id=eq.1&select=comprados`, { headers: API_HEADERS });
                const data = await res.json();
                if (data?.[0]?.comprados) comprados = new Set(data[0].comprados);
            } catch (e) {
                showToast('⚠️ No se pudo conectar');
            }
            document.getElementById('loading').style.display = 'none';
            render();
        }

        async function saveState() {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/coleccion?id=eq.1`, {
                    method: 'PATCH',
                    headers: API_HEADERS,
                    body: JSON.stringify({ comprados: [...comprados] })
                });
                showToast('Guardado ✓');
            } catch (e) {
                showToast('⚠️ Error al guardar');
            }
        }

        function debouncedSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveState, 600);
        }

        function setFilter(f, btn) {
            filtro = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function updateStats() {
            const c = comprados.size;
            const pct = Math.round(c / LIBROS.length * 100);
            document.getElementById('stat-comprados').textContent = c;
            document.getElementById('stat-faltan').textContent = LIBROS.length - c;
            document.getElementById('stat-pct').textContent = pct + '%';
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        function render() {
            const q = document.getElementById('search').value.toLowerCase();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let visible = 0;

            LIBROS.forEach((titulo, i) => {
                const esCom = comprados.has(i);
                if (filtro === 'comprados' && !esCom) return;
                if (filtro === 'faltan' && esCom) return;
                if (q && !titulo.toLowerCase().includes(q)) return;
                visible++;

                const col = document.createElement('div');
                col.className = 'col-6 col-sm-4 col-md-3';
                col.innerHTML = `
                    <div class="book-card rounded-3 p-3 h-100 d-flex align-items-start gap-2 ${esCom ? 'comprado' : ''}">
                    <span class="book-num pt-1">${i + 1}</span>
                    <span class="book-title flex-grow-1" style="font-size:0.8rem; line-height:1.45;">${titulo}</span>
                    <div class="check-circle mt-1">
                        ${esCom ? `<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}
                    </div>
                    </div>`;
                col.querySelector('.book-card').onclick = () => {
                    if (comprados.has(i)) comprados.delete(i);
                    else comprados.add(i);
                    updateStats();
                    render();
                    debouncedSave();
                };
                grid.appendChild(col);
            });

            if (visible === 0) {
                grid.innerHTML = '<div class="col text-center text-secondary py-4">No hay resultados</div>';
            }
            updateStats();
        }

        function showToast(msg) {
            if (!toastEl) toastEl = new bootstrap.Toast(document.getElementById('toast'), { delay: 2000 });
            document.getElementById('toast-msg').textContent = msg;
            toastEl.show();
        }

        loadState();
    </script>
</body>

</html>
